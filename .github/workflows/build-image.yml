name: Build image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: minimal
            enable_graphical_login: "false"
          - name: desktop
            enable_graphical_login: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso curl unzip

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Install AWS CLI
        run: |
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi

          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install
          aws --version

      - name: Configure image variant
        run: |
          cat > nemesis-cloud.conf <<EOF
          NEMESIS_USER="user"
          NEMESIS_USER_PASSWORD="Ch4ngeM3!"
          NEMESIS_HOSTNAME=""
          ENABLE_GRAPHICAL_LOGIN="${{ matrix.variant.enable_graphical_login }}"
          INSTALL_PROFILE="image"
          SSH_AUTHORIZED_KEY=""
          RDP_USER="rdp"
          RDP_PASSWORD="rdp"
          NEMESIS_REPO_URL=""
          NEMESIS_REPO_REF="main"
          EOF

      - name: Build image
        run: ./build-image.sh

      - name: Generate checksums
        run: |
          sha256sum \
            packer/output/nemesis-cloud/nemesis-cloud.qcow2 \
            packer/output/nemesis-cloud/nemesis-cloud.raw \
            > packer/output/nemesis-cloud/SHA256SUMS

      - name: Upload images to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: |
          set -euo pipefail

          out="packer/output/nemesis-cloud"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          remote_prefix="${{ matrix.variant.name }}/latest"

          if [[ -n "${R2_PREFIX:-}" ]]; then
            remote_prefix="${R2_PREFIX%/}/${{ matrix.variant.name }}/latest"
          fi

          aws --endpoint-url "$endpoint" s3 cp "$out/nemesis-cloud.qcow2" "s3://${R2_BUCKET}/${remote_prefix}/nemesis-cloud.qcow2"
          aws --endpoint-url "$endpoint" s3 cp "$out/nemesis-cloud.raw" "s3://${R2_BUCKET}/${remote_prefix}/nemesis-cloud.raw"
          aws --endpoint-url "$endpoint" s3 cp "$out/SHA256SUMS" "s3://${R2_BUCKET}/${remote_prefix}/SHA256SUMS"
