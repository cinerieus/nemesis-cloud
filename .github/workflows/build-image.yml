name: Build image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso zstd curl unzip awscli

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Build image
        run: ./build-image.sh

      - name: Compress images
        run: |
          zstd -T0 -10 -f packer/output/nemesis-cloud/nemesis-cloud.qcow2
          zstd -T0 -10 -f packer/output/nemesis-cloud/nemesis-cloud.raw
          sha256sum \
            packer/output/nemesis-cloud/nemesis-cloud.qcow2.zst \
            packer/output/nemesis-cloud/nemesis-cloud.raw.zst \
            > packer/output/nemesis-cloud/SHA256SUMS

      - name: Upload images to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: |
          set -euo pipefail

          out="packer/output/nemesis-cloud"
          prefix="${R2_PREFIX:-nemesis-cloud}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws --endpoint-url "$endpoint" s3 cp "$out/nemesis-cloud.qcow2.zst" "s3://${R2_BUCKET}/${prefix}/latest/nemesis-cloud.qcow2.zst"
          aws --endpoint-url "$endpoint" s3 cp "$out/nemesis-cloud.raw.zst" "s3://${R2_BUCKET}/${prefix}/latest/nemesis-cloud.raw.zst"
          aws --endpoint-url "$endpoint" s3 cp "$out/SHA256SUMS" "s3://${R2_BUCKET}/${prefix}/latest/SHA256SUMS"
