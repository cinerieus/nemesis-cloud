name: Build image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso curl unzip

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Install AWS CLI
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install
          aws --version

      - name: Build image
        run: ./build-image.sh

      - name: Generate checksums
        run: |
          sha256sum \
            packer/output/nemesis-cloud/nemesis-cloud.qcow2 \
            packer/output/nemesis-cloud/nemesis-cloud.raw \
            > packer/output/nemesis-cloud/SHA256SUMS

      - name: Upload images to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: |
          set -euo pipefail

          out="packer/output/nemesis-cloud"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          remote_prefix="latest"

          if [[ -n "${R2_PREFIX:-}" ]]; then
            remote_prefix="${R2_PREFIX%/}/latest"
          fi

          aws --endpoint-url "$endpoint" s3 cp "$out/nemesis-cloud.qcow2" "s3://${R2_BUCKET}/${remote_prefix}/nemesis-cloud.qcow2"
          aws --endpoint-url "$endpoint" s3 cp "$out/nemesis-cloud.raw" "s3://${R2_BUCKET}/${remote_prefix}/nemesis-cloud.raw"
          aws --endpoint-url "$endpoint" s3 cp "$out/SHA256SUMS" "s3://${R2_BUCKET}/${remote_prefix}/SHA256SUMS"
