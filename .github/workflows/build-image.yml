name: Build image

on:
  workflow_dispatch:
  # Enable this later if you want regular rebuilds.
  # schedule:
  #   - cron: "0 3 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso zstd curl unzip

      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Build image
        run: ./build-image.sh

      - name: Compress raw image
        run: |
          zstd -T0 -10 packer/output/nemesis-cloud/nemesis-cloud.raw
          sha256sum \
            packer/output/nemesis-cloud/nemesis-cloud.qcow2 \
            packer/output/nemesis-cloud/nemesis-cloud.raw.zst \
            > packer/output/nemesis-cloud/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nemesis-cloud
          path: |
            packer/output/nemesis-cloud/nemesis-cloud.qcow2
            packer/output/nemesis-cloud/nemesis-cloud.raw.zst
            packer/output/nemesis-cloud/SHA256SUMS
          retention-days: 7
